{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="{% static 'main/images/icon.ico' %}" type="image/x-icon">

    <title>{% block title %}TRX PHYSIOTHERAPY & CHIROPRACTIC CENTER{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}
    TRX Physiotherapy & Chiropractic Center in Kathmandu, Nepal.
    {% endblock %}">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">

    <!-- Google Tag -->
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3S2RQYWJFH"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-3S2RQYWJFH');
    </script>
    <script type="application/ld+json">
    {
    "@context": "https://schema.org",
    "@type": "MedicalBusiness", 
    "name": "TRX Physiotherapy & Chiropractic Center",
    "url": "https://www.trx.com.np/",
    "logo": "https://www.trx.com.np/static/main/images/trx-logo.png",
    "image": "https://www.trx.com.np/static/main/images/clinic-exterior.png",
    "description": "Expert physiotherapy and chiropractic care in Kathmandu, Nepal.",
    "address": {
        "@type": "PostalAddress",
        "streetAddress": "Thapathali Complex, Thapathali",
        "addressLocality": "Kathmandu",
        "postalCode": "44600",
        "addressRegion": "Bagmati",
        "addressCountry": "NP"
    },
    "geo": {
        "@type": "GeoCoordinates",
        "latitude": 27.69005287996023,
        "longitude": 85.31775070279156
    },
    "hasMap": "https://maps.app.goo.gl/5Vndtk3AWrbTQYNH8",
    "telephone": [
        "+977-9851408989",
        "+977-9862208989"
    ]
    }
    </script>
</head>

<body>
    <div class="page">

        <!-- Logo -->
        <header class="site-header">
            <nav class="navbar">
                <!-- Logo -->
                <a href="/" class="logo-link">
                    <!-- <img src="{% static 'main/images/trx-logo.png' %}"
                        alt="TRX Physiotherapy & Chiropractic Center Logo" class="main-logo"> -->
                    {% if site_settings and site_settings.logo %}
                    <img src="{{ site_settings.logo.url }}" alt="{{ site_settings.name }}" class="main-logo"
                        title="{{ site_settings.name }}">
                    {% endif %}
                </a>

                <!-- Navigation Links -->
                <ul class="nav-links" id="nav-links">
                    <a href="/" class="{% if request.path == '/' %}active{% endif %}">Home</a>
                    <li><a href="/about/" class="{% if request.path == '/about/' %}active{% endif %}">About</a></li>
                    <li><a href="/services/" class="{% if request.path == '/services/' %}active{% endif %}">Services</a>
                    </li>
                    <li><a href="/blog/" class="{% if '/blog/' in request.path %}active{% endif %}">Blogs</a></li>
                    <li><a href="/gallery/" class="{% if request.path == '/gallery/' %}active{% endif %}">Gallery</a>
                    </li>
                    <!-- <li><a href="/appointment/" class="{% if request.path == '/appointment/' %}active{% endif %}">Book an Appointment</a></li> -->
                    <li>
                        <a href="/appointment/"
                            class="nav-btn-link {% if request.path == '/appointment/' %}active{% endif %}">
                            Book an Appointment
                        </a>
                    </li>
                </ul>

                <!-- Right Controls -->
                <div class="nav-actions">
                    <!-- Theme Toggle -->
                    <button id="theme-toggle" aria-label="Toggle theme">
                        <i id="theme-icon" class="fas fa-moon"></i>
                    </button>

                    <!-- Mobile Menu Button -->
                    <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
            </nav>
        </header>

        {% block content %}
        {% endblock %}

    </div>
    <!-- Main JS -->
    {% include 'main/footer.html' %}
    <script src="{% static 'main/js/script.js' %}"></script>
</body>

</html>
